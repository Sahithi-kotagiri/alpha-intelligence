[project]
name = "investment-intelligence"
version = "0.0.1"
description = "Evidence-led investment research, committee decisions and thesis monitoring (prototype)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "httpx>=0.27,<1.0",
    "yfinance>=1.8.0",
    "pandas>=3.1.1",
    "numpy>=2.5.5",
    "lxml>=6.1.3",
    "sqlalchemy>=2.1.9",
    "alembic>=1.20.1",
    "anthropic>=1.0",
    "langgraph>=1.2.24",
    "pyyaml>=6.0.3",
    "sse-starlette>=3.7.0",
    "python-multipart>=0.0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
