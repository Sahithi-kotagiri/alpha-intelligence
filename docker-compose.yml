# Local/prototype deployment: PostgreSQL + API + web. Secrets come from .env (never committed).
services:
  db:
    image: postgres:16.10
    environment:
      POSTGRES_USER: ii
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ii
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ii"], interval: 5s, retries: 10}
  backend:
    build: {context: ., dockerfile: Dockerfile.backend}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ii:${POSTGRES_PASSWORD}@db:5432/ii
      CACHE_DIR: /app/data/cache
      CORS_ORIGINS: http://localhost:3000
    depends_on: {db: {condition: service_healthy}}
    volumes: [cache:/app/data]
    ports: ["127.0.0.1:8000:8000"]
  frontend:
    build: {context: frontend}
    environment: {API_INTERNAL_URL: http://backend:8000}
    depends_on: [backend]
    ports: ["127.0.0.1:3000:3000"]
volumes: {pgdata: {}, cache: {}}
